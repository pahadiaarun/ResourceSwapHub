spring:
  application:
    name: ResourceSwapHub
  datasource:
    url: ${BOOKBRIDGE_DB_URL:jdbc:postgresql://127.0.0.1:55432/bookbridge}
    username: ${BOOKBRIDGE_DB_USER:bookbridge}
    password: ${BOOKBRIDGE_DB_PASSWORD:bookbridge_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 22MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${BOOKBRIDGE_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

bookbridge:
  jwt-secret: ${BOOKBRIDGE_JWT_SECRET:WsD1y+M73mhQLGaG60N2arNpJjrunT04oaFL1WTi1S8XjNCLXReE4XTYq10BPbX7}
  access-token-ttl: PT15M
  refresh-token-ttl: P7D
  refresh-cookie-name: bb_refresh
  cookie-secure: ${BOOKBRIDGE_COOKIE_SECURE:false}
  frontend-origin: ${BOOKBRIDGE_FRONTEND_ORIGIN:http://localhost:3000}
  cors-allowed-origins: ${BOOKBRIDGE_CORS_ORIGINS:http://localhost:3000}
  storage-dir: ${BOOKBRIDGE_STORAGE_DIR:./storage}
  google-client-id: ${GOOGLE_CLIENT_ID:936835640150-uil23srp7vfjoul6it9jg3tueolg088p.apps.googleusercontent.com}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request}] %logger{36} - %msg%n"
  level:
    com.bookbridge: INFO
    org.springframework.web: INFO

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: ${BOOKBRIDGE_TEST_DB_URL:jdbc:postgresql://127.0.0.1:55432/bookbridge_test}
  jpa:
    hibernate:
      ddl-auto: validate

bookbridge:
  jwt-secret: ${BOOKBRIDGE_TEST_JWT_SECRET:WsD1y+M73mhQLGaG60N2arNpJjrunT04oaFL1WTi1S8XjNCLXReE4XTYq10BPbX7}
  storage-dir: ${java.io.tmpdir}/bookbridge-test-storage
  google-client-id: ${BOOKBRIDGE_TEST_GOOGLE_CLIENT_ID:936835640150-uil23srp7vfjoul6it9jg3tueolg088p.apps.googleusercontent.com}
