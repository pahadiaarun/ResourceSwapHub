# ResourceSwapHub local development stack.
#
# Everything shares one network: the API container reaches PostgreSQL as
# `postgres:5432` while the browser reaches both services through the published
# ports (8080 for REST/WebSocket, 3000 for the Next.js app).
#
#   docker compose up -d        # start postgres + api + web
#   docker compose up -d postgres
#                               # database only, for running the API locally
#   docker compose down         # stop; add -v to drop the database volume

name: resourceswaphub

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bookbridge
      POSTGRES_USER: bookbridge
      POSTGRES_PASSWORD: bookbridge_dev
    ports:
      - "55432:5432" # host port matches database/scripts/local-postgres.sh defaults
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookbridge -d bookbridge"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: "./ResourceSwapHub Backend"
      dockerfile: Dockerfile
    image: resourceswaphub/api:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BOOKBRIDGE_DB_URL: jdbc:postgresql://postgres:5432/bookbridge
      BOOKBRIDGE_DB_USER: bookbridge
      BOOKBRIDGE_DB_PASSWORD: bookbridge_dev
      BOOKBRIDGE_CORS_ORIGINS: http://localhost:3000
      BOOKBRIDGE_FRONTEND_ORIGIN: http://localhost:3000
      BOOKBRIDGE_JWT_SECRET: ${BOOKBRIDGE_JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "8080:8080"
    volumes:
      - api-storage:/workspace/storage
    restart: unless-stopped

  web:
    build:
      context: "./ResourceSwapHub FrontEnd"
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    image: resourceswaphub/web:local
    depends_on:
      - api
    environment:
      BACKEND_URL: http://api:8080 # server-to-server (Next.js rewrites)
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  api-storage:
